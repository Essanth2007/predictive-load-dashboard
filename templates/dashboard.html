<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predictive Load Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: #080e1a;
    color: #e2e8f0;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    background: #0d1526;
    border-bottom: 1px solid #1e2d45;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-icon {
    width: 38px;
    height: 38px;
    background: linear-gradient(135deg, #6366f1, #3b82f6);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  header h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
    background: linear-gradient(90deg, #a5b4fc, #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  #lastUpdated {
    font-size: 12px;
    color: #64748b;
  }

  /* ── Layout ── */
  .page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* ── Alert Banner ── */
  #alertBox {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 22px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    border: 1px solid transparent;
    transition: background 0.4s, border-color 0.4s;
  }

  #alertBox.normal {
    background: rgba(20, 83, 45, 0.35);
    border-color: #166534;
    color: #86efac;
  }

  #alertBox.danger {
    background: rgba(127, 29, 29, 0.45);
    border-color: #991b1b;
    color: #fca5a5;
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  .alert-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  #alertBox.normal .alert-dot { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  #alertBox.danger .alert-dot { background: #ef4444; box-shadow: 0 0 8px #ef4444; }

  /* ── Stat Cards ── */
  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .card {
    background: #0d1526;
    border: 1px solid #1e2d45;
    border-radius: 16px;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: border-color 0.3s, transform 0.2s;
  }

  .card:hover { border-color: #334d6e; transform: translateY(-2px); }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-label {
    font-size: 13px;
    font-weight: 500;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  .card-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }

  .card-value {
    font-size: 38px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -1px;
  }

  /* progress bar */
  .bar-track {
    height: 6px;
    background: #1e2d45;
    border-radius: 99px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.6s ease;
  }

  /* per-metric colours */
  .cpu .card-icon  { background: rgba(239,68,68,.15); }
  .cpu .card-value { color: #f87171; }
  .cpu .bar-fill   { background: linear-gradient(90deg, #ef4444, #f97316); }

  .ram .card-icon  { background: rgba(59,130,246,.15); }
  .ram .card-value { color: #60a5fa; }
  .ram .bar-fill   { background: linear-gradient(90deg, #3b82f6, #6366f1); }

  .disk .card-icon  { background: rgba(34,197,94,.15); }
  .disk .card-value { color: #4ade80; }
  .disk .bar-fill   { background: linear-gradient(90deg, #22c55e, #10b981); }

  /* ── Chart Card ── */
  .chart-card {
    background: #0d1526;
    border: 1px solid #1e2d45;
    border-radius: 16px;
    padding: 24px;
  }

  .chart-title {
    font-size: 14px;
    font-weight: 600;
    color: #94a3b8;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  canvas { max-height: 380px; }

  /* ── Responsive ── */
  @media (max-width: 700px) {
    .cards { grid-template-columns: 1fr; }
    header h1 { font-size: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="header-icon">⚡</div>
    <h1>Predictive Load Dashboard</h1>
  </div>
  <span id="lastUpdated">Connecting…</span>
</header>

<div class="page">

  <!-- Alert -->
  <div id="alertBox" class="normal">
    <div class="alert-dot"></div>
    <span id="alertText">System Normal</span>
  </div>

  <!-- Stat Cards -->
  <div class="cards">
    <div class="card cpu">
      <div class="card-header">
        <span class="card-label">CPU Usage</span>
        <div class="card-icon">🖥️</div>
      </div>
      <div class="card-value"><span id="cpuVal">—</span><span style="font-size:18px;color:#64748b">%</span></div>
      <div class="bar-track"><div class="bar-fill" id="cpuBar" style="width:0%"></div></div>
    </div>

    <div class="card ram">
      <div class="card-header">
        <span class="card-label">RAM Usage</span>
        <div class="card-icon">💾</div>
      </div>
      <div class="card-value"><span id="ramVal">—</span><span style="font-size:18px;color:#64748b">%</span></div>
      <div class="bar-track"><div class="bar-fill" id="ramBar" style="width:0%"></div></div>
    </div>

    <div class="card disk">
      <div class="card-header">
        <span class="card-label">Disk Usage</span>
        <div class="card-icon">📀</div>
      </div>
      <div class="card-value"><span id="diskVal">—</span><span style="font-size:18px;color:#64748b">%</span></div>
      <div class="bar-track"><div class="bar-fill" id="diskBar" style="width:0%"></div></div>
    </div>
  </div>

  <!-- Chart -->
  <div class="chart-card">
    <div class="chart-title">Historical Metrics (last 15 snapshots)</div>
    <canvas id="chart"></canvas>
  </div>

</div>

<script>
const ctx = document.getElementById('chart').getContext('2d');

const makeDataset = (label, color) => ({
  label,
  data: [],
  borderColor: color,
  backgroundColor: color + '18',
  borderWidth: 2.5,
  pointRadius: 3,
  pointHoverRadius: 6,
  tension: 0.4,
  fill: true
});

const chart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: [],
    datasets: [
      makeDataset('CPU %',  '#f87171'),
      makeDataset('RAM %',  '#60a5fa'),
      makeDataset('Disk %', '#4ade80')
    ]
  },
  options: {
    responsive: true,
    animation: { duration: 400 },
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: {
        labels: {
          color: '#94a3b8',
          usePointStyle: true,
          pointStyleWidth: 10,
          font: { family: 'Inter', size: 12 }
        }
      },
      tooltip: {
        backgroundColor: '#0d1526',
        borderColor: '#1e2d45',
        borderWidth: 1,
        titleColor: '#e2e8f0',
        bodyColor: '#94a3b8',
        padding: 12,
        callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)}%` }
      }
    },
    scales: {
      x: {
        grid: { color: '#1e2d45' },
        ticks: { color: '#475569', font: { family: 'Inter', size: 11 } }
      },
      y: {
        min: 0, max: 100,
        grid: { color: '#1e2d45' },
        ticks: {
          color: '#475569',
          font: { family: 'Inter', size: 11 },
          callback: v => v + '%'
        }
      }
    }
  }
});

function setCard(valId, barId, value) {
  document.getElementById(valId).textContent = value.toFixed(1);
  document.getElementById(barId).style.width = Math.min(value, 100) + '%';
}

function loadData() {
  fetch('/data')
    .then(r => r.json())
    .then(d => {
      // chart
      chart.data.labels = d.labels;
      chart.data.datasets[0].data = d.cpu;
      chart.data.datasets[1].data = d.ram;
      chart.data.datasets[2].data = d.disk;
      chart.update();

      // stat cards
      setCard('cpuVal',  'cpuBar',  d.latest.cpu);
      setCard('ramVal',  'ramBar',  d.latest.ram);
      setCard('diskVal', 'diskBar', d.latest.disk);

      // alert
      const box  = document.getElementById('alertBox');
      const text = document.getElementById('alertText');
      const isAlert = d.alert !== 'System Normal';
      box.className = isAlert ? 'danger' : 'normal';
      text.textContent = isAlert ? '⚠ ' + d.alert : '✓ System Normal';

      // timestamp
      document.getElementById('lastUpdated').textContent =
        'Updated ' + new Date().toLocaleTimeString();
    });
}

loadData();
setInterval(loadData, 3000);
</script>
</body>
</html>
